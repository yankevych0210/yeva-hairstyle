<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      // Прихований стан reveal-анімацій лише з JS. Якщо застосунок не стартував за 3 с — показуємо все.
      document.documentElement.classList.add('js');
      setTimeout(function () { if (!window.__revealReady) document.documentElement.classList.remove('js'); }, 3000);
    </script>
    <title>%TITLE%</title>
    <meta name="description" content="%DESCRIPTION%" />
    <link rel="canonical" href="%SITE_URL%/" />
    <link rel="alternate" hreflang="uk" href="%SITE_URL%/" />
    <link rel="alternate" hreflang="x-default" href="%SITE_URL%/" />
    <!--verification-->
    <meta name="theme-color" content="%THEME_COLOR%" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-video-preview:-1" />
    <meta name="author" content="%SITE_NAME%" />
    <meta name="geo.region" content="UA-53" />
    <meta name="geo.placename" content="Кременчук" />
    <meta name="application-name" content="Yeva" />
    <meta name="apple-mobile-web-app-title" content="Yeva" />
    <meta name="color-scheme" content="light" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="author" href="/humans.txt" type="text/plain" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="uk_UA" />
    <meta property="og:site_name" content="%SITE_NAME%" />
    <meta property="og:title" content="%OG_TITLE%" />
    <meta property="og:description" content="%OG_DESCRIPTION%" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%OG_IMAGE%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="%OG_ALT%" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%OG_TITLE%" />
    <meta name="twitter:description" content="%OG_DESCRIPTION%" />
    <meta name="twitter:image" content="%OG_IMAGE%" />
    <meta name="twitter:image:alt" content="%OG_ALT%" />

    <!--font-preload-->

    <!--hero-preload-->
    <!--json-ld-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
